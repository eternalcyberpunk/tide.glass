<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Steiner Circuit Bend Editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;
  --surface:#181818;
  --surface2:#222;
  --border:#2e2e2e;
  --text:#f0f0f0;
  --text-muted:#888;
  --accent:#e8ff57;
  --accent-dark:#c8df30;
  --radius:10px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Courier New',monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh}

.app{display:flex;flex-direction:column;width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10}
.topbar-title{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.topbar-btn{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;font-size:12px;font-weight:700;color:var(--text-muted);cursor:pointer;font-family:inherit;letter-spacing:.05em;display:flex;align-items:center;gap:6px;transition:all .15s}
.topbar-btn:hover{border-color:var(--text-muted);color:var(--text)}
.topbar-btn.export{background:var(--accent);color:#000;border-color:var(--accent)}
.topbar-btn.export:hover{background:var(--accent-dark);border-color:var(--accent-dark)}

.preview-area{position:relative;background:#000;width:100%;aspect-ratio:9/16;max-height:360px;overflow:hidden;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border)}
canvas#preview{max-width:100%;max-height:100%;object-fit:contain;display:block}
.preview-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.7);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:10px;color:var(--accent);font-weight:700;letter-spacing:.08em;display:none}
.upload-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-muted);cursor:pointer}
.upload-hint i{font-size:36px;color:var(--border)}
.upload-hint p{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
input#fileIn{display:none}

.timeline{padding:10px 14px;border-bottom:1px solid var(--border)}
.section-label{font-size:10px;color:var(--text-muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.tl-track{height:34px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;position:relative;cursor:pointer}
.tl-bar{position:absolute;top:3px;bottom:3px;left:4px;right:4px;background:#2a2a2a;border-radius:6px;display:none;align-items:center;padding:0 10px;font-size:11px;color:var(--text-muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);left:0;border-radius:1px}

.effects-panel{flex:1;overflow-y:auto;padding:14px}

.preset-scroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-bottom:14px}
.preset-scroll::-webkit-scrollbar{display:none}
.preset-chip{flex:0 0 auto;padding:6px 13px;border:1px solid var(--border);border-radius:20px;font-size:11px;cursor:pointer;white-space:nowrap;background:var(--surface);color:var(--text-muted);font-family:inherit;font-weight:700;letter-spacing:.04em;transition:all .12s}
.preset-chip.active{background:var(--accent);color:#000;border-color:var(--accent)}
.preset-chip:hover:not(.active){border-color:var(--text-muted);color:var(--text)}

.param-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.param-label{font-size:11px;color:var(--text-muted);width:86px;flex-shrink:0;letter-spacing:.04em}
.param-row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:3px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
.param-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer}
.param-row input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer;border:none}
.param-val{font-size:11px;color:var(--text);width:34px;text-align:right;font-family:inherit;font-variant-numeric:tabular-nums}

.colormode-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cm-btn{padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-size:10px;cursor:pointer;background:var(--surface);color:var(--text-muted);font-family:inherit;font-weight:700;letter-spacing:.04em;transition:all .12s}
.cm-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}

.apply-btn{width:100%;padding:13px;background:var(--accent);color:#000;border:none;border-radius:var(--radius);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;transition:all .12s;display:flex;align-items:center;justify-content:center;gap:8px}
.apply-btn:hover{background:var(--accent-dark)}
.apply-btn:active{transform:scale(0.98)}

.bottom-tabs{display:flex;border-top:1px solid var(--border);background:var(--bg);position:sticky;bottom:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0;cursor:pointer;color:var(--text-muted);font-size:10px;gap:4px;border:none;background:none;font-family:inherit;letter-spacing:.06em;text-transform:uppercase;font-weight:700;transition:color .12s}
.tab i{font-size:20px}
.tab.active{color:var(--accent)}

.divider{height:1px;background:var(--border);margin:12px 0}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <button class="topbar-btn" onclick="document.getElementById('fileIn').click()">
      <i class="ti ti-upload"></i> Import
    </button>
    <span class="topbar-title">Steiner Edit</span>
    <button class="topbar-btn export" onclick="exportFrame()">
      <i class="ti ti-download"></i> Export
    </button>
  </div>
  <input type="file" id="fileIn" accept="image/*,video/*">

  <div class="preview-area" id="previewArea" onclick="if(!srcImageData)document.getElementById('fileIn').click()">
    <canvas id="preview"></canvas>
    <div class="upload-hint" id="uploadHint">
      <i class="ti ti-photo-plus"></i>
      <p>Tap to import photo or video</p>
    </div>
    <div class="preview-badge" id="effectLabel">Severance Hex</div>
  </div>

  <div class="timeline">
    <div class="section-label">Timeline</div>
    <div class="tl-track">
      <div class="tl-bar" id="tlBar"></div>
      <div class="tl-playhead" id="tlHead"></div>
    </div>
  </div>

  <div class="effects-panel">
    <div class="section-label">Circuit bend preset</div>
    <div class="preset-scroll" id="presetScroll"></div>

    <div class="section-label">Diffusion weights</div>
    <div class="param-row">
      <span class="param-label">Threshold</span>
      <input type="range" id="pThresh" min="0" max="255" step="1" value="127">
      <span class="param-val" id="vThresh">127</span>
    </div>
    <div class="param-row">
      <span class="param-label">Weight 1</span>
      <input type="range" id="pW1" min="0" max="1" step="0.01" value="0.44">
      <span class="param-val" id="vW1">0.44</span>
    </div>
    <div class="param-row">
      <span class="param-label">Weight 2</span>
      <input type="range" id="pW2" min="0" max="1" step="0.01" value="0.30">
      <span class="param-val" id="vW2">0.30</span>
    </div>
    <div class="param-row">
      <span class="param-label">Weight 3</span>
      <input type="range" id="pW3" min="0" max="1" step="0.01" value="0.19">
      <span class="param-val" id="vW3">0.19</span>
    </div>
    <div class="param-row">
      <span class="param-label">Weight 4</span>
      <input type="range" id="pW4" min="0" max="1" step="0.01" value="0.06">
      <span class="param-val" id="vW4">0.06</span>
    </div>

    <div class="divider"></div>
    <div class="section-label">Render settings</div>
    <div class="param-row">
      <span class="param-label">Downscale</span>
      <input type="range" id="pDown" min="1" max="8" step="1" value="1">
      <span class="param-val" id="vDown">1×</span>
    </div>
    <div class="param-row">
      <span class="param-label">Spread</span>
      <input type="range" id="pSpread" min="0.1" max="3" step="0.05" value="1.0">
      <span class="param-val" id="vSpread">1.00</span>
    </div>
    <div class="param-row">
      <span class="param-label">Direction</span>
      <input type="range" id="pDir" min="1" max="4" step="1" value="1">
      <span class="param-val" id="vDir">→</span>
    </div>

    <div class="divider"></div>
    <div class="section-label" style="margin-bottom:8px">Color mode</div>
    <div class="colormode-row" id="cmRow">
      <button class="cm-btn active" data-cm="0">None</button>
      <button class="cm-btn" data-cm="1">RGB→GBB</button>
      <button class="cm-btn" data-cm="2">RGB→GBR</button>
      <button class="cm-btn" data-cm="3">RGB→BGR</button>
      <button class="cm-btn" data-cm="4">RGB→BRG</button>
    </div>

    <button class="apply-btn" onclick="applyEffect()">
      <i class="ti ti-wand"></i> Apply circuit bend
    </button>
  </div>

  <div class="bottom-tabs">
    <button class="tab active"><i class="ti ti-cut"></i><span>Effects</span></button>
    <button class="tab"><i class="ti ti-adjustments-horizontal"></i><span>Adjust</span></button>
    <button class="tab"><i class="ti ti-music"></i><span>Audio</span></button>
    <button class="tab"><i class="ti ti-text-size"></i><span>Text</span></button>
  </div>
</div>

<script>
const PRESETS = [
  {name:"Severance Hex", w:[7/16,3/16,5/16,1/16], t:127, cm:0, ds:1, dir:1, sp:1.0},
  {name:"Aether Surge",  w:[1,1/8,1/8,1/8],       t:200, cm:3, ds:2, dir:2, sp:1.2},
  {name:"Solar Maw",     w:[0,1,1/8,0],            t:27,  cm:2, ds:4, dir:3, sp:0.8},
  {name:"Mindlock",      w:[1,0,0,0],              t:252, cm:4, ds:1, dir:4, sp:1.5},
  {name:"Codeveil",      w:[0,0,0,1],              t:56,  cm:3, ds:1, dir:2, sp:1.0},
  {name:"Thornkiss",     w:[0.23,0.64,0,0],        t:254, cm:3, ds:1, dir:1, sp:0.5},
  {name:"Neurostatic",   w:[0.72,0,0,0],           t:127, cm:1, ds:8, dir:1, sp:1.0},
  {name:"Nebula Drift",  w:[0.5,0.3,0.15,0.05],   t:180, cm:1, ds:3, dir:2, sp:1.8},
  {name:"Crystal Gaze",  w:[0.4,0.35,0.15,0.1],   t:210, cm:2, ds:1, dir:4, sp:1.75},
  {name:"Void Whisper",  w:[0.12,0.24,0.48,0.16], t:90,  cm:4, ds:2, dir:3, sp:1.1},
  {name:"Quantum Remnant",w:[0.33,0.33,0.33,0],   t:0,   cm:3, ds:2, dir:1, sp:1.02},
  {name:"Arcane Echo",   w:[0.6,0.25,0.15,0],     t:140, cm:2, ds:2, dir:2, sp:1.3},
  {name:"Cipher Mirage", w:[0.45,0,0.45,0.1],     t:110, cm:1, ds:3, dir:4, sp:0.7},
  {name:"Reinhardt",     w:[0.23,0.64,0,0],        t:101, cm:2, ds:1, dir:1, sp:0.8},
  {name:"Neuro Dreams",  w:[0.72,0,0,0],           t:127, cm:4, ds:9, dir:3, sp:1.0},
];

let srcImageData = null;
let colorMode = 0;

const canvas = document.getElementById('preview');
const ctx = canvas.getContext('2d');

function buildPresets() {
  const scroll = document.getElementById('presetScroll');
  PRESETS.forEach((p,i) => {
    const chip = document.createElement('button');
    chip.className = 'preset-chip' + (i===0?' active':'');
    chip.textContent = p.name;
    chip.onclick = () => selectPreset(i, chip);
    scroll.appendChild(chip);
  });
}

function selectPreset(i, chip) {
  document.querySelectorAll('.preset-chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  const p = PRESETS[i];
  setSlider('Thresh', p.t, Math.round(p.t));
  setSlider('W1', p.w[0], p.w[0].toFixed(2));
  setSlider('W2', p.w[1], p.w[1].toFixed(2));
  setSlider('W3', p.w[2], p.w[2].toFixed(2));
  setSlider('W4', p.w[3], p.w[3].toFixed(2));
  setSlider('Down', Math.min(p.ds,8), Math.min(p.ds,8)+'×');
  setSlider('Spread', p.sp, p.sp.toFixed(2));
  setSlider('Dir', p.dir, dirLabels[p.dir-1]);
  setColorMode(p.cm);
  document.getElementById('effectLabel').textContent = p.name;
  if (srcImageData) applyEffect();
}

function setSlider(id, val, display) {
  document.getElementById('p'+id).value = val;
  document.getElementById('v'+id).textContent = display;
}

const dirLabels = ['→','←','↑','↓'];

function setColorMode(cm) {
  colorMode = cm;
  document.querySelectorAll('.cm-btn').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.cm)===cm);
  });
}

document.querySelectorAll('.cm-btn').forEach(b=>{
  b.onclick=()=>setColorMode(parseInt(b.dataset.cm));
});

document.getElementById('pThresh').addEventListener('input',function(){
  document.getElementById('vThresh').textContent=Math.round(this.value);
});
document.getElementById('pW1').addEventListener('input',function(){document.getElementById('vW1').textContent=parseFloat(this.value).toFixed(2)});
document.getElementById('pW2').addEventListener('input',function(){document.getElementById('vW2').textContent=parseFloat(this.value).toFixed(2)});
document.getElementById('pW3').addEventListener('input',function(){document.getElementById('vW3').textContent=parseFloat(this.value).toFixed(2)});
document.getElementById('pW4').addEventListener('input',function(){document.getElementById('vW4').textContent=parseFloat(this.value).toFixed(2)});
document.getElementById('pDown').addEventListener('input',function(){document.getElementById('vDown').textContent=Math.round(this.value)+'×'});
document.getElementById('pSpread').addEventListener('input',function(){document.getElementById('vSpread').textContent=parseFloat(this.value).toFixed(2)});
document.getElementById('pDir').addEventListener('input',function(){document.getElementById('vDir').textContent=dirLabels[Math.max(0,parseInt(this.value)-1)]});

document.getElementById('fileIn').addEventListener('change', function(e){
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  if (file.type.startsWith('video/')) {
    const video = document.createElement('video');
    video.src = url;
    video.muted = true;
    video.onloadeddata = () => {
      video.currentTime = 0;
    };
    video.onseeked = () => {
      const MAX = 480;
      let w = video.videoWidth, h = video.videoHeight;
      const scale = Math.min(MAX/w, MAX/h, 1);
      w = Math.round(w*scale); h = Math.round(h*scale);
      canvas.width = w; canvas.height = h;
      ctx.drawImage(video, 0, 0, w, h);
      srcImageData = ctx.getImageData(0, 0, w, h);
      finishLoad(file.name);
      URL.revokeObjectURL(url);
    };
  } else {
    const img = new Image();
    img.onload = () => {
      const MAX = 480;
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(MAX/w, MAX/h, 1);
      w = Math.round(w*scale); h = Math.round(h*scale);
      canvas.width = w; canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      srcImageData = ctx.getImageData(0, 0, w, h);
      finishLoad(file.name);
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }
});

function finishLoad(name) {
  document.getElementById('uploadHint').style.display = 'none';
  document.getElementById('effectLabel').style.display = 'block';
  const bar = document.getElementById('tlBar');
  bar.style.display = 'flex';
  bar.textContent = '■ ' + name.substring(0,28);
}

function clampU8(v) { return Math.max(0, Math.min(255, Math.round(v))); }

function applyColorMode(r, g, b, cm) {
  switch(cm) {
    case 1: return [g, b, b];
    case 2: return [g, b, r];
    case 3: return [b, g, r];
    case 4: return [b, r, g];
    default: return [r, g, b];
  }
}

function steinerDither(src, w, h, params) {
  const {t, w1, w2, w3, w4, cm, ds, dir, sp} = params;
  const scale = Math.max(1, Math.min(ds, 8));
  const sw = Math.max(1, Math.floor(w/scale));
  const sh = Math.max(1, Math.floor(h/scale));

  const small = new Uint8ClampedArray(sw*sh*4);
  for (let y=0;y<sh;y++) {
    for (let x=0;x<sw;x++) {
      const sx = Math.min(Math.floor(x*scale), w-1);
      const sy = Math.min(Math.floor(y*scale), h-1);
      const si = (sy*w + sx)*4;
      const di = (y*sw+x)*4;
      small[di]=src[si]; small[di+1]=src[si+1]; small[di+2]=src[si+2]; small[di+3]=255;
    }
  }

  const errR = new Float32Array(sw*sh);
  const errG = new Float32Array(sw*sh);
  const errB = new Float32Array(sw*sh);

  const forward = (dir===1||dir===3);
  for (let y=0;y<sh;y++) {
    const xs = forward ? 0 : sw-1;
    const xe = forward ? sw : -1;
    const dx = forward ? 1 : -1;
    for (let x=xs; x!==xe; x+=dx) {
      const i = (y*sw+x)*4;
      const er=errR[y*sw+x], eg=errG[y*sw+x], eb=errB[y*sw+x];
      const nr=clampU8(small[i]  +er*sp);
      const ng=clampU8(small[i+1]+eg*sp);
      const nb=clampU8(small[i+2]+eb*sp);
      const qr=nr>t?255:0, qg=ng>t?255:0, qb=nb>t?255:0;
      const [fr,fg,fb]=applyColorMode(qr,qg,qb,cm);
      small[i]=fr; small[i+1]=fg; small[i+2]=fb;
      const der=nr-qr, deg=ng-qg, deb=nb-qb;
      const nx1=x+dx, nx2=x+dx*2, ny1=y+1;
      if(nx1>=0&&nx1<sw){errR[y*sw+nx1]+=der*w1;errG[y*sw+nx1]+=deg*w1;errB[y*sw+nx1]+=deb*w1;}
      if(nx2>=0&&nx2<sw){errR[y*sw+nx2]+=der*w2;errG[y*sw+nx2]+=deg*w2;errB[y*sw+nx2]+=deb*w2;}
      if(ny1<sh){
        if(nx1>=0&&nx1<sw){errR[ny1*sw+nx1]+=der*w3;errG[ny1*sw+nx1]+=deg*w3;errB[ny1*sw+nx1]+=deb*w3;}
        if(x>=0&&x<sw){errR[ny1*sw+x]+=der*w4;errG[ny1*sw+x]+=deg*w4;errB[ny1*sw+x]+=deb*w4;}
      }
    }
  }

  const out = new Uint8ClampedArray(w*h*4);
  for (let y=0;y<h;y++) {
    for (let x=0;x<w;x++) {
      const sx=Math.min(Math.floor(x/scale),sw-1);
      const sy=Math.min(Math.floor(y/scale),sh-1);
      const si=(sy*sw+sx)*4;
      const di=(y*w+x)*4;
      out[di]=small[si];out[di+1]=small[si+1];out[di+2]=small[si+2];out[di+3]=255;
    }
  }
  return out;
}

function applyEffect() {
  if (!srcImageData) return;
  const {width:w, height:h, data} = srcImageData;
  const params = {
    t:   parseFloat(document.getElementById('pThresh').value),
    w1:  parseFloat(document.getElementById('pW1').value),
    w2:  parseFloat(document.getElementById('pW2').value),
    w3:  parseFloat(document.getElementById('pW3').value),
    w4:  parseFloat(document.getElementById('pW4').value),
    cm:  colorMode,
    ds:  parseInt(document.getElementById('pDown').value),
    dir: parseInt(document.getElementById('pDir').value),
    sp:  parseFloat(document.getElementById('pSpread').value),
  };
  const result = steinerDither(data, w, h, params);
  ctx.putImageData(new ImageData(result, w, h), 0, 0);
}

function exportFrame() {
  if (!srcImageData) { alert('Import an image first.'); return; }
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'steiner_export.png';
  a.click();
}

buildPresets();
selectPreset(0, document.querySelector('.preset-chip'));
</script>
</body>
</html>
